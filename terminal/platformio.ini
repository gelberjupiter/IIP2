; PlatformIO-Projekt fuer das Referenz-Terminal (ESP32 #2)
; Board per USB-C anschliessen, dann: pio run -t upload ; pio device monitor

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit NeoPixel @ ^1.12.3
